[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-energy-monitoring"
version = "0.1.0"
description = "Smart Energy Monitoring & Intelligent Load Prediction System (IoT + ML + Streamlit)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["energy-monitoring", "iot", "mqtt", "time-series", "machine-learning", "ece"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "streamlit>=1.30",
    "plotly>=5.18",
    "paho-mqtt>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Used only by the Jupyter notebooks in notebooks/
notebooks = ["jupyterlab>=4.0", "matplotlib>=3.7", "seaborn>=0.13"]
# Optional 4th forecasting model; the pipeline runs fine without it
boosting = ["xgboost>=2.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["src*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
